plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.example.recipemanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.recipemanager'
        // java.nio.file / java.time / java.util.Base64 を使うため API 26 以上
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // デスクトップ版(RecipeManagement)とファイル構成・パッケージ名(main.java.*)を揃えるため、
    // src/ をソースルートにして src/main/java/... を main.java パッケージとして扱う
    sourceSets {
        main {
            java.srcDirs = ['src']
        }
    }
}

dependencies {
    // appcompat と同時に入る Kotlin 標準ライブラリのバージョン重複を揃える
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
}
